aid: university-startups
name: University Startups
description: University Startups is an AI-powered transition planning management
  platform built for special education teams. The platform helps teachers create
  IDEA-compliant IEP transition plans in under 10 minutes, audits plans against 11
  IDEA Indicator 13 criteria in under 90 seconds, generates SMART-format IEP goals,
  and engages students with disabilities in building their own transition plans,
  alongside a college and career readiness curriculum and internship simulator. A
  Techstars portfolio company serving United States school districts including NYC
  Public Schools; no public developer API surface is published.
